    // ================================================================
    // SECCIÓN: MOTOR — TRANSPOSASA PONG (Fig. 2c)
    // ================================================================
    function renderTransposase(step, variant) {
      const w = appState.logicalW, h = appState.logicalH, p = appState.animationProgress;
      const cx = w / 2;

      const pComplex   = smooth(clamp(p / 0.10, 0, 1));
      const pTargetDSB = smooth(clamp((p - 0.10) / 0.15, 0, 1));
      const pMpingCut  = smooth(clamp((p - 0.25) / 0.15, 0, 1));
      const pTravel    = smooth(clamp((p - 0.40) / 0.20, 0, 1));
      const pIntegr    = smooth(clamp((p - 0.60) / 0.20, 0, 1));
      const pFinal     = smooth(clamp((p - 0.80) / 0.10, 0, 1));

      const targetY = 375;
      const targetX1 = 60, targetX2 = w - 60;
      const dsbX = cx - 60;

      const plasmidW = 220, plasmidH = 55;
      const plasmidX = w - plasmidW - 40;
      const plasmidY = 95;
      const mpingStartX = plasmidX + 50;
      const mpingW = 110, mpingH = 36;

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.fillStyle = '#1e3a8a';
      ctx.font = '600 20px "Garamond", "Georgia", serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(step.title, cx, 26);
      ctx.fillStyle = '#57534e';
      ctx.font = 'italic 14px "Garamond", "Georgia", serif';
      ctx.fillText(variant.label, cx, 46);
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = '#0891b2'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      if (pTargetDSB < 0.5) {
        ctx.beginPath();
        ctx.moveTo(targetX1, targetY); ctx.lineTo(targetX2, targetY);
        ctx.stroke();
      } else {
        const gap = 34;
        ctx.beginPath();
        ctx.moveTo(targetX1, targetY); ctx.lineTo(dsbX - gap/2, targetY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(dsbX + gap/2, targetY); ctx.lineTo(targetX2, targetY);
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.fillStyle = '#0891b2';
      ctx.font = 'italic 11px "Garamond", serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('ADN genómico diana', targetX1, targetY + 26);
      ctx.restore();

      if (pTargetDSB > 0.3) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, (pTargetDSB - 0.3) * 2);
        ctx.fillStyle = '#dc2626';
        ctx.font = 'bold 11px "Garamond", serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText('DSB · rotura bicatenaria', dsbX, targetY + 18);
        ctx.restore();
      }

      ctx.save();
      ctx.globalAlpha = pComplex;
      drawRoundRect(plasmidX, plasmidY, plasmidW, plasmidH, 10, '#f3f4f6', '#9ca3af', 2);
      ctx.fillStyle = '#6b7280';
      ctx.font = 'italic 10px "Garamond", serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('plásmido donante', plasmidX + plasmidW/2, plasmidY - 6);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = pComplex;
      const tirW = 10;
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(mpingStartX - tirW, plasmidY + 10, tirW, plasmidH - 20);
      ctx.fillRect(mpingStartX + mpingW, plasmidY + 10, tirW, plasmidH - 20);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 7px "Courier New", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('TIR', mpingStartX - tirW/2, plasmidY + plasmidH/2);
      ctx.fillText('TIR', mpingStartX + mpingW + tirW/2, plasmidY + plasmidH/2);
      ctx.restore();

      let mpingX = mpingStartX;
      let mpingY = plasmidY + (plasmidH - mpingH) / 2;
      let mpingAlpha = 1;

      if (pMpingCut > 0.5 && pIntegr < 0.9) {
        const t = pTravel;
        mpingX = lerp(mpingStartX, dsbX - mpingW/2, t);
        mpingY = lerp(plasmidY + (plasmidH - mpingH)/2, targetY - mpingH - 20, t);
      }
      if (pIntegr > 0.5) {
        const t = smooth((pIntegr - 0.5) / 0.5);
        mpingY = lerp(targetY - mpingH - 20, targetY - mpingH/2, t);
        mpingAlpha = lerp(1, 0.9, t);
      }

      ctx.save();
      ctx.globalAlpha = pComplex * mpingAlpha;
      const mpGrad = ctx.createLinearGradient(mpingX, mpingY, mpingX, mpingY + mpingH);
      mpGrad.addColorStop(0, '#f472b6');
      mpGrad.addColorStop(1, '#db2777');
      drawRoundRect(mpingX, mpingY, mpingW, mpingH, 6, mpGrad, '#9d174d', 2);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px "Courier New", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('mPing', mpingX + mpingW/2, mpingY + 12);
      ctx.font = '9px "Garamond", serif';
      ctx.fillText('cassette donante', mpingX + mpingW/2, mpingY + 26);
      ctx.restore();

      if (pComplex > 0.01) {
        const complexX = cx + 120;
        const complexY = 250;

        ctx.save();
        ctx.globalAlpha = pComplex;
        drawRoundRect(complexX - 60, complexY - 25, 120, 50, 10, '#4b5563', '#1f2937', 2);
        ctx.fillStyle = '#f9fafb';
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('Cas9', complexX, complexY - 6);
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 9px "Courier New", monospace';
        ctx.fillText('+ ORF1 + ORF2', complexX, complexY + 10);
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = pComplex;
        drawProteinCircle(complexX - 78, complexY, 14, '#f59e0b', darken('#f59e0b', 0.3), 'ORF1', 1);
        drawProteinCircle(complexX + 78, complexY, 14, '#f59e0b', darken('#f59e0b', 0.3), 'ORF2', 1);
        ctx.restore();

        if (pComplex > 0.5) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, (pComplex - 0.5) * 2);
          ctx.fillStyle = '#78350f';
          ctx.font = 'italic 11px "Garamond", serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          ctx.fillText('fusión Cas9–Pong', complexX, complexY + 36);
          ctx.restore();
        }

        if (pMpingCut > 0.1 && pMpingCut < 0.9) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, (pMpingCut - 0.1) * 2) * (1 - pMpingCut * 0.7);
          drawArrow(complexX - 20, complexY - 25, mpingStartX + mpingW/2, plasmidY + plasmidH + 4, '#dc2626', 2.5, 1);
          ctx.restore();
          ctx.save();
          ctx.globalAlpha = Math.min(1, (pMpingCut - 0.1) * 2) * (1 - pMpingCut * 0.7);
          ctx.fillStyle = '#dc2626';
          ctx.font = 'bold 10px "Garamond", serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('TIR reconocidas → escisión', mpingStartX + mpingW/2, plasmidY + plasmidH + 22);
          ctx.restore();
        }
      }

      if (pFinal > 0.3) {
        const insY = targetY - mpingH/2;
        ctx.save();
        ctx.globalAlpha = Math.min(1, (pFinal - 0.3) / 0.7);
        const grad = ctx.createLinearGradient(dsbX - mpingW/2, insY, dsbX - mpingW/2, insY + mpingH);
        grad.addColorStop(0, '#f9a8d4');
        grad.addColorStop(1, '#ec4899');
        drawRoundRect(dsbX - mpingW/2, insY, mpingW, mpingH, 6, grad, '#9d174d', 2);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('mPing integrado', dsbX, insY + 13);
        ctx.font = '9px "Garamond", serif';
        ctx.fillText('(vía NHEJ)', dsbX, insY + 27);
        ctx.restore();
      }

      if (pFinal > 0.01) {
        const resY = 460, boxW = 560, boxX = cx - boxW/2;
        ctx.save();
        ctx.globalAlpha = pFinal;
        const grad = ctx.createLinearGradient(boxX, resY - 22, boxX, resY + 22);
        grad.addColorStop(0, '#d1fae5');
        grad.addColorStop(1, '#a7f3d0');
        drawRoundRect(boxX, resY - 22, boxW, 44, 8, grad, '#065f46', 2);
        ctx.fillStyle = '#064e3b';
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('¡INGENIERÍA CROMOSÓMICA Y PRECISIÓN QUIRÚRGICA ALCANZADA!', cx, resY - 5);
        ctx.font = '11px "Garamond", serif';
        ctx.fillText('Cassette mPing integrado por NHEJ en el DSB dirigido', cx, resY + 11);
        ctx.restore();
      }

      drawTransposaseLegend(w, h);
    }

    function drawTransposaseLegend(w, h) {
      const items = [
        { color: '#0891b2', label: 'ADN diana' },
        { color: '#374151', label: 'Cas9' },
        { color: '#f59e0b', label: 'ORF1 / ORF2 (transposasa)' },
        { color: '#ec4899', label: 'mPing (cassette)' },
        { color: '#dc2626', label: 'TIR (repeticiones)' }
      ];
      const itemH = 15, boxW = 210, boxH = items.length * itemH + 20;
      const boxX = w - boxW - 15, boxY = 60;

      ctx.save();
      drawRoundRect(boxX, boxY, boxW, boxH, 6, 'rgba(255,255,255,0.95)', '#d6d3d1', 1);
      ctx.fillStyle = '#1e3a8a';
      ctx.font = 'bold 9px "Courier New", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('LEYENDA', boxX + 8, boxY + 9);
      items.forEach((it, i) => {
        const y = boxY + 24 + i * itemH;
        ctx.fillStyle = it.color;
        ctx.fillRect(boxX + 8, y - 5, 10, 10);
        ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 0.8;
        ctx.strokeRect(boxX + 8, y - 5, 10, 10);
        ctx.fillStyle = '#374151';
        ctx.font = '9.5px "Garamond", serif';
        ctx.fillText(it.label, boxX + 22, y);
      });
      ctx.restore();
    }


    // ================================================================
    // SECCIÓN: DISPATCHER DE CANVAS
    // ================================================================
    function renderCanvas() {
      const step = getStepById(appState.currentStepId);
      const variant = getVariant(step, appState.currentVariantId);

      if (step.tab === 'base-editors') {
        renderBaseEditor(step, variant);
      } else if (step.tab === 'prime-editing') {
        renderPrimeEditing(step, variant);
      }
    }


    // ================================================================
    // SECCIÓN: RENDERIZADO — SELECTORES
    // ================================================================
    function renderSelectors() {
      const stepsInTab = preciseEditingSteps
        .filter(s => s.tab === appState.currentTab)
        .sort((a, b) => a.order - b.order);
      dom.selectorList.innerHTML = '';

      stepsInTab.forEach(step => {
        const isActive = step.id === appState.currentStepId;
        const group = document.createElement('div');
        group.className = 'selector-group' + (isActive ? ' active' : '');

        const mainBtn = document.createElement('button');
        mainBtn.type = 'button';
        mainBtn.className = 'selector-main';
        mainBtn.setAttribute('aria-pressed', isActive ? 'true' : 'false');

        const nameEl = document.createElement('span');
        nameEl.className = 'selector-name';
        nameEl.textContent = step.selectorLabel;

        const hintEl = document.createElement('span');
        hintEl.className = 'selector-hint';
        hintEl.textContent = step.variantHint;

        mainBtn.appendChild(nameEl);
        mainBtn.appendChild(hintEl);
        mainBtn.addEventListener('click', () => selectStep(step.id));
        group.appendChild(mainBtn);

        if (isActive) {
          const variantsDiv = document.createElement('div');
          variantsDiv.className = 'variants';
          step.variants.forEach(v => {
            const vBtn = document.createElement('button');
            vBtn.type = 'button';
            vBtn.className = 'variant' + (v.id === appState.currentVariantId ? ' active' : '');
            vBtn.setAttribute('aria-pressed', v.id === appState.currentVariantId ? 'true' : 'false');
            vBtn.textContent = v.label;
            vBtn.addEventListener('click', () => selectVariant(v.id));
            variantsDiv.appendChild(vBtn);
          });
          group.appendChild(variantsDiv);
        }
        dom.selectorList.appendChild(group);
      });
    }


    // ================================================================
    // SECCIÓN: RENDERIZADO — VENTANA EXPLICATIVA
    // ================================================================
    function renderExplanatoryWindow() {
      const step = getStepById(appState.currentStepId);
      const variant = getVariant(step, appState.currentVariantId);

      dom.expStepBadge.textContent = `Estado ${step.order} · de ${preciseEditingSteps.length}`;

    }


    // ================================================================
    // SECCIÓN: REDIMENSIONAMIENTO DEL CANVAS (SIEMPRE CABE EN CONTENEDOR)
    // ================================================================
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const logicalW = appState.logicalW;
      const logicalH = appState.logicalH;
      const container = dom.canvas.parentElement;
      const rect = container.getBoundingClientRect();

      // Padding del contenedor: 12px (--space-3 en .canvas-container)
      const paddingPx = 12;
      const availableW = Math.max(100, rect.width - paddingPx * 2);
      const availableH = Math.max(100, rect.height - paddingPx * 2);

      // Escala: el canvas SIEMPRE cabe en el contenedor disponible
      let scale = Math.min(availableW / logicalW, availableH / logicalH);

      // Cap superior para evitar que la animación se vea desproporcionadamente grande
      scale = Math.min(scale, 1.15);

      // Dimensiones finales en CSS px (con floor para evitar desbordes por decimales)
      const cssW = Math.max(100, Math.floor(logicalW * scale));
      const cssH = Math.max(100, Math.floor(logicalH * scale));

      dom.canvas.width  = Math.round(cssW * dpr);
      dom.canvas.height = Math.round(cssH * dpr);
      dom.canvas.style.width  = cssW + 'px';
      dom.canvas.style.height = cssH + 'px';

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale((cssW / logicalW) * dpr, (cssH / logicalH) * dpr);
    }


    // ================================================================
    // SECCIÓN: ANIMACIÓN (con multiplicador de velocidad)
    // ================================================================
    function resetAnimation() {
      appState.animationProgress = 0;
      appState.lastTime = performance.now();
      appState.isAnimating = true;
    }

    function animationLoop(timestamp) {
      const dt = timestamp - appState.lastTime;
      appState.lastTime = timestamp;
      if (appState.isAnimating && appState.animationProgress < 1) {
        appState.animationProgress += (dt / 1000) * 0.20 * appState.speedMultiplier;
        if (appState.animationProgress > 1) appState.animationProgress = 1;
        renderCanvas();
      }
      requestAnimationFrame(animationLoop);
    }


    // ================================================================
    // SECCIÓN: ACCIONES DE ESTADO
    // ================================================================
    function selectTab(tabId) {
      if (appState.currentTab === tabId) return;
      appState.currentTab = tabId;
      const firstStep = preciseEditingSteps
        .filter(s => s.tab === tabId)
        .sort((a, b) => a.order - b.order)[0];
      if (firstStep) {
        appState.currentStepId = firstStep.id;
        appState.currentVariantId = firstStep.variants[0].id;
      }
      resetAnimation();
      updateTabsUI();
      updateAll();
    }

    function selectStep(stepId) {
      if (appState.currentStepId === stepId) return;
      appState.currentStepId = stepId;
      const step = getStepById(stepId);
      appState.currentVariantId = step.variants[0].id;
      resetAnimation();
      updateAll();
    }

    function selectVariant(variantId) {
      if (appState.currentVariantId === variantId) return;
      appState.currentVariantId = variantId;
      resetAnimation();
      updateAll();
    }

    function setSpeed(multiplier) {
      appState.speedMultiplier = multiplier;
      dom.speedBtns.forEach(btn => {
        const isActive = parseFloat(btn.dataset.speed) === multiplier;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });
      appState.lastTime = performance.now();
    }

    function updateTabsUI() {
      dom.tabs.forEach(tab => {
        const isActive = tab.dataset.tab === appState.currentTab;
        tab.classList.toggle('active', isActive);
        tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });
    }

    function updateAll() {
      renderSelectors();
      renderExplanatoryWindow();
      renderCanvas();
    }


    // ================================================================
    // SECCIÓN: EVENTOS
    // ================================================================
    dom.tabs.forEach(tab => {
      tab.addEventListener('click', () => selectTab(tab.dataset.tab));
    });

    dom.speedBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        setSpeed(parseFloat(btn.dataset.speed));
      });
    });

    dom.restartBtn.addEventListener('click', () => {
      resetAnimation();
      renderCanvas();
    });

    window.addEventListener('resize', () => {
      // Esperar al siguiente frame para que el layout esté calculado
      requestAnimationFrame(() => {
        resizeCanvas();
        renderCanvas();
      });
    });


    // ================================================================
    // SECCIÓN: INICIALIZACIÓN
    // ================================================================
    function init() {
      Object.entries(PALETTE).forEach(([key, item]) => {
        document.documentElement.style.setProperty(
          '--color-' + key.replace(/_/g, '-'), item.color
        );
      });
      appState.currentTab = 'base-editors';
      appState.currentStepId = 'cbe';
      appState.currentVariantId = 'cbe-t';
      appState.speedMultiplier = 1;

      updateTabsUI();
      updateAll();

      // Esperar dos frames para que el layout esté completamente calculado
      // antes de dimensionar el canvas
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          resizeCanvas();
          renderCanvas();
          resetAnimation();
          requestAnimationFrame(animationLoop);
        });
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
